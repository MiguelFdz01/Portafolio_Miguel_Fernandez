<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />

    <title> CREAR LISTA DE DESEOS </title>

    <link rel="stylesheet" href="lista_de_deseos.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">


    <style>

        .parrafoprueba {
            display: flex;
        }

        .inicio {
            margin-right: 25px;
        }

        .lista_compras {
            margin-right: 25px;
        }

        .lista_deseos {
            margin-right: 25px;
        }

        .perfil {
            margin-right: 25px;
        }

        .productos {
            margin-right: 25px;
        }

        .buscador {
            margin-right: 25px;
        }

        .chat {
            margin-right: 25px;
        }

        .consulta_ventas {
            margin-right: 25px;
        }


        .cerrar {
            margin-right: 25px;
        }
    </style>


</head>


<body>


    <header>

        <div class="logo">

            <img src="7749078932_c476055cdf_w.jpg" alt="logo" />

        </div>

        <nav>

            <div class="parrafoprueba">

                <p class="inicio">
                    <a href="" class="nav-link" target=""> Inicio </a>
                </p>


                <p class="lista_compras">
                    <a href="" class="nav-link" target=""> Lista de compras </a>
                </p>


                <p class="lista_deseos">
                    <a href="" class="nav-link" target=""> Lista de deseos </a>
                </p>


                <p class="perfil">
                    <a href="" class="nav-link" target=""> Perfil de usuario </a>
                </p>


                <p class="productos">
                    <a href="" class="nav-link" target=""> Productos </a>
                </p>


                <p class="buscador">
                    <a href="" class="nav-link" target=""> Buscador </a>
                </p>


                <p class="chat">
                    <a href="" class="nav-link" target=""> Chat </a>
                </p>


                <p class="consulta_ventas">
                    <a href="" class="nav-link" target=""> Consulta de ventas </a>
                </p>


                <p class="cerrar">
                    <a href="" class="nav-link"> Cerrar Sesion </a>
                </p>

            </div>



        </nav>

        <!-- <div class="cuadro2">

            <p1>  Perfil  </p1>

        </div> -->


    </header>



    <br /> <br />




    <center>

        <div class="cuadro">

            <div class="borde">

                <div id="centro">

                    <p id="parrafo"> CREAR LISTA DE DESEOS </p>

                    <form>

                        <div class="mb-3">

                            <label for="nombre">Nombre de lista: </label>
                            <input type="text" class="form-control" name="nombre" id="nombre">

                        </div>

                        <br />

                        <div class="mb-2">

                            <label for="descripcion">Descripción: </label>
                            <textarea class="form-control" name="descripcion" id="descripcion"></textarea>
                        </div>



                        <br />

                        <div class="mb-2">
                            <label for="imagenes">Imagenes: </label>

                            <input type="file" class="form-control" name="imagenes" id="imagenes">

                            <br />

                            <input type="file" class="form-control" name="imagenes" id="imagenes">
                        </div>


                        <br />

                        <button type="submit" class="btn btn-primary"> Crear </button>


                    </form>



                </div>

            </div>

        </div>


        <br /> <br />


    </center>


    <br />


    <center>

        <div class="cuadro">

            <div class="borde">

                <div id="centro">

                    <p id="parrafo"> EDITAR / ELIMINAR LISTA DE DESEOS </p>

                    <form>

                        <div class="mb-3">

                            <label for="nombre">Nombre de lista: </label>
                            <input type="text" class="form-control" name="nombre" id="nombre">

                            <button type="submit" class="btn btn-primary"> Buscar </button>

                        </div>



                        <div class="mb-2">

                            <label for="descripcion">Descripción: </label>
                            <textarea class="form-control" name="descripcion" id="descripcion"></textarea>
                        </div>



                        <br />

                        <div class="mb-2">
                            <label for="imagenes">Imagenes: </label>

                            <input type="file" class="form-control" name="imagenes" id="imagenes">

                            <br />

                            <input type="file" class="form-control" name="imagenes" id="imagenes">
                        </div>



                        <button type="submit" class="btn btn-primary"> Editar </button>

                        <br />

                        <button type="submit" class="btn btn-primary"> Eliminar </button>


                    </form>



                </div>

            </div>

        </div>

    </center>



</body>

</html>
