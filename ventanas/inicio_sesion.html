<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />

    <title> INICIAR SESION </title>

    <link rel="stylesheet" href="inicio_sesion.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">


</head>


<body>

    <center>

        <br /> <br />

        <div class="cuadro">

            <div class="borde">

                <div id="centro">


                    <div class="logo">

                        <img src="7749078932_c476055cdf_w.jpg" alt="logo" />


                        <br /> <br /> <br />
                        <p id="parrafo"> INICIAR SESION </p>



                        <nav>
                            <div class="mb-3">
                                <label for="usuario" class="form-label"> Usuario:  </label>
                                <input type="text" class="form-control" id="usuario" required />
                            </div>



                            <div class="mb-3">
                                <label for="contraseña" class="form-label"> Contraseña:  </label>
                                <input type="password" class="form-control" id="contraseña" required>
                            </div>




                            <label for=""> ¿Quiere ser recordado? </label>
                            <br />
                            <input type="radio" name="recordar" value="si" /> Si
                            <input type="radio" name="recordar" value="no" /> No

                            <br />



                            <br />
                            <form action="" target="">

                                <button type="submit" class="btn btn-primary"> Ingresar </button>

                            </form>

                            <br />

                            <form action="" target="">

                                <button type="submit" class="btn btn-primary"> Registrarse </button>

                            </form>


                        </nav>


                    </div>

                </div>

            </div>

        </div>




    </center>

</body>

</html>
