<!DOCTYPE html>
<!-- Indica que el documento utiliza HTML5 -->

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>

    <!-- Permite utilizar caracteres especiales como acentos y la letra ñ -->
    <meta charset="utf-8" />

    <!-- Título que aparecerá en la pestaña del navegador -->
    <title>CREAR LISTA DE DESEOS</title>

    <!-- Archivo CSS personalizado de la página -->
    <link rel="stylesheet" href="lista_de_deseos.css" />

    <!-- Biblioteca Bootstrap para utilizar sus estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
          crossorigin="anonymous">

    <!-- Estilos internos para separar las opciones del menú -->
    <style>

        /* Coloca las opciones del menú en una fila */
        .parrafoprueba {
            display: flex;
        }

        /* Agrega un espacio entre cada opción del menú */
        .inicio {
            margin-right: 25px;
        }

        .lista_compras {
            margin-right: 25px;
        }

        .lista_deseos {
            margin-right: 25px;
        }

        .perfil {
            margin-right: 25px;
        }

        .productos {
            margin-right: 25px;
        }

        .buscador {
            margin-right: 25px;
        }

        .chat {
            margin-right: 25px;
        }

        .consulta_ventas {
            margin-right: 25px;
        }

        .cerrar {
            margin-right: 25px;
        }
    </style>

</head>

<body>

    <!-- Encabezado principal de la página -->
    <header>

        <!-- Contenedor del logotipo -->
        <div class="logo">

            <!-- Imagen del logotipo -->
            <img src="7749078932_c476055cdf_w.jpg" alt="logo" />

        </div>

        <!-- Menú de navegación -->
        <nav>

            <!-- Contenedor de todas las opciones del menú -->
            <div class="parrafoprueba">

                <!-- Enlace a Inicio -->
                <p class="inicio">
                    <a href="" class="nav-link" target="">Inicio</a>
                </p>

                <!-- Enlace a Lista de compras -->
                <p class="lista_compras">
                    <a href="" class="nav-link" target="">Lista de compras</a>
                </p>

                <!-- Enlace a Lista de deseos -->
                <p class="lista_deseos">
                    <a href="" class="nav-link" target="">Lista de deseos</a>
                </p>

                <!-- Enlace al Perfil de usuario -->
                <p class="perfil">
                    <a href="" class="nav-link" target="">Perfil de usuario</a>
                </p>

                <!-- Enlace a Productos -->
                <p class="productos">
                    <a href="" class="nav-link" target="">Productos</a>
                </p>

                <!-- Enlace al Buscador -->
                <p class="buscador">
                    <a href="" class="nav-link" target="">Buscador</a>
                </p>

                <!-- Enlace al Chat -->
                <p class="chat">
                    <a href="" class="nav-link" target="">Chat</a>
                </p>

                <!-- Enlace a Consulta de ventas -->
                <p class="consulta_ventas">
                    <a href="" class="nav-link" target="">Consulta de ventas</a>
                </p>

                <!-- Enlace para cerrar sesión -->
                <p class="cerrar">
                    <a href="" class="nav-link">Cerrar Sesion</a>
                </p>

            </div>

        </nav>

        <!-- Sección comentada que actualmente no se muestra -->
        <!--
        <div class="cuadro2">
            <p1>Perfil</p1>
        </div>
        -->

    </header>

    <!-- Espacio entre el encabezado y el contenido -->
    <br /><br />

    <!-- Centra el contenido -->
    <center>

        <!-- Primer cuadro: Crear lista de deseos -->
        <div class="cuadro">

            <div class="borde">

                <div id="centro">

                    <!-- Título del formulario -->
                    <p id="parrafo">CREAR LISTA DE DESEOS</p>

                    <!-- Formulario para crear una nueva lista -->
                    <form>

                        <!-- Campo para escribir el nombre de la lista -->
                        <div class="mb-3">

                            <label for="nombre">Nombre de lista:</label>

                            <input type="text"
                                   class="form-control"
                                   name="nombre"
                                   id="nombre">

                        </div>

                        <br />

                        <!-- Campo para escribir la descripción -->
                        <div class="mb-2">

                            <label for="descripcion">Descripción:</label>

                            <textarea class="form-control"
                                      name="descripcion"
                                      id="descripcion"></textarea>

                        </div>

                        <br />

                        <!-- Campos para subir imágenes de la lista -->
                        <div class="mb-2">

                            <label for="imagenes">Imagenes:</label>

                            <input type="file"
                                   class="form-control"
                                   name="imagenes"
                                   id="imagenes">

                            <br />

                            <input type="file"
                                   class="form-control"
                                   name="imagenes"
                                   id="imagenes">

                        </div>

                        <br />

                        <!-- Botón para crear la lista -->
                        <button type="submit" class="btn btn-primary">
                            Crear
                        </button>

                    </form>

                </div>

            </div>

        </div>

        <br /><br />

    </center>

    <br />

    <!-- Segundo formulario: Editar o eliminar una lista -->
    <center>

        <div class="cuadro">

            <div class="borde">

                <div id="centro">

                    <!-- Título del formulario -->
                    <p id="parrafo">EDITAR / ELIMINAR LISTA DE DESEOS</p>

                    <form>

                        <!-- Campo para buscar una lista por nombre -->
                        <div class="mb-3">

                            <label for="nombre">Nombre de lista:</label>

                            <input type="text"
                                   class="form-control"
                                   name="nombre"
                                   id="nombre">

                            <!-- Botón para buscar la lista -->
                            <button type="submit" class="btn btn-primary">
                                Buscar
                            </button>

                        </div>

                        <!-- Campo para modificar la descripción -->
                        <div class="mb-2">

                            <label for="descripcion">Descripción:</label>

                            <textarea class="form-control"
                                      name="descripcion"
                                      id="descripcion"></textarea>

                        </div>

                        <br />

                        <!-- Campos para cambiar las imágenes -->
                        <div class="mb-2">

                            <label for="imagenes">Imagenes:</label>

                            <input type="file"
                                   class="form-control"
                                   name="imagenes"
                                   id="imagenes">

                            <br />

                            <input type="file"
                                   class="form-control"
                                   name="imagenes"
                                   id="imagenes">

                        </div>

                        <!-- Botón para guardar los cambios -->
                        <button type="submit" class="btn btn-primary">
                            Editar
                        </button>

                        <br />

                        <!-- Botón para eliminar la lista -->
                        <button type="submit" class="btn btn-primary">
                            Eliminar
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </center>

</body>

</html>
