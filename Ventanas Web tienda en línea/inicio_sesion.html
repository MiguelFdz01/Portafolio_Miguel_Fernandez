<!DOCTYPE html>     <!-- Indica que el documento utiliza HTML5 -->

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />         <!-- Configura la codificación de caracteres para admitir acentos y caracteres especiales -->

    <title> INICIAR SESION </title>     <!-- Título que aparecerá en la pestaña del navegador -->

    <link rel="stylesheet" href="inicio_sesion.css" />      <!-- Enlace al archivo CSS personalizado -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">       <!-- Enlace a Bootstrap para utilizar estilos y componentes prediseñados -->


</head>


<body>

    <!-- Centra todo el contenido de la página -->
    <center>


        <!-- Saltos de línea para dejar espacio en la parte superior -->
        <br /> <br />


        <!-- Contenedor principal del formulario -->
               <div class="cuadro">


                   <!-- Contenedor que agrega un borde mediante CSS -->
                   <div class="borde">


                       <!-- Contenedor para centrar el contenido -->
                       <div id="centro">


                           <!-- Sección donde se encuentra el logo y el formulario -->
                           <div class="logo">


                               <!-- Imagen del logo -->
                               <img src="7749078932_c476055cdf_w.jpg" alt="logo" />


                               <!-- Espacio y título del formulario -->
                               <br /> <br /> <br />
                               <p id="parrafo"> INICIAR SESION </p>


                               <!-- Menú que contiene los elementos del formulario -->
                               <nav>

                                   <!-- Campo para ingresar el nombre de usuario -->
                                   <div class="mb-3">
                                       <label for="usuario" class="form-label"> Usuario:  </label>
                                       <input type="text" class="form-control" id="usuario" required />
                                   </div>



                                   <!-- Campo para ingresar la contraseña -->
                                   <div class="mb-3">
                                       <label for="contraseña" class="form-label"> Contraseña:  </label>
                                       <input type="password" class="form-control" id="contraseña" required>
                                   </div>



                                   <!-- Pregunta para recordar al usuario -->
                                   <label for=""> ¿Quiere ser recordado? </label>
                                   <br />
                                   <input type="radio" name="recordar" value="si" /> Si     <!-- Opción Sí -->
                                   <input type="radio" name="recordar" value="no" /> No     <!-- Opción No -->

                                   <br />



                                   <br />

                                   <!-- Formulario para el botón de ingresar -->
                                   <form action="" target="">

                                       <button type="submit" class="btn btn-primary"> Ingresar </button>

                                   </form>

                                   <br />

                                   <!-- Formulario para el botón de registrarse -->
                                   <form action="" target="">

                                       <button type="submit" class="btn btn-primary"> Registrarse </button>

                                   </form>


                               </nav>


                           </div>

                       </div>

                   </div>

               </div>




    </center>

</body>

</html>
