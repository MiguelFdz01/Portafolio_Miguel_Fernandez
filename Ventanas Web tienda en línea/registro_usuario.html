<!-- Indica que el documento está escrito en HTML5 -->
<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />                <!-- Permite utilizar caracteres especiales como acentos y la letra ñ -->

    <title> REGISTRAR USUARIO </title>      <!-- Título que aparecerá en la pestaña del navegador -->

    <link rel="stylesheet" href="registro_usuario.css" />       <!-- Enlace al archivo CSS personalizado -->
    
    <!-- Enlace a Bootstrap para utilizar sus estilos y componentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">

</head>


<body>

    <script src="registro_usuario.js"></script>         <!-- Carga el archivo JavaScript encargado de las validaciones -->

    <center>
        <!-- Centra el contenido de la página -->


        <br /> <br />       <!-- Espacio en la parte superior -->
        
    
        <!-- Contenedor principal del formulario -->
        <div class="cuadro">

            <div class="borde">             <!-- Contenedor con borde -->

                <div id="centro">           <!-- Contenedor central -->


                    <div class="logo">
                        <!-- Contenedor del logo y formulario -->


                        <img src="7749078932_c476055cdf_w.jpg" alt="logo" />        <!-- Imagen del logo -->


                        <br /> <br /> <br />

                        <p id="parrafo"> REGISTRO DE USUARIO </p>       <!-- Título del formulario -->

                        <nav>


                            <!-- Formulario que enviará la información a la página de inicio de sesión -->
                            <form action="iniciar sesion.html">


                                <!-- Campo para ingresar el correo electrónico -->
                                <div class="mb-3">
                                    <label for="exampleInputEmail1" class="form-label"> Correo electronico:  </label>
                                    <input type="email" class="form-control" id="correo" aria-describedby="correo" accept="email/*" required>
                                </div>

                                <br />


                                <!-- Campo para escribir el nombre de usuario -->
                                <div class="mb-3">
                                    <label for="exampleInputEmail1" class="form-label"> Nombre de usuario:  </label>
                                    <input type="text" class="form-control" minlength="3" id="usuario" aria-describedby="usuario" accept="text/*" required>
                                </div>

                                <br />


                                <!-- Campo para ingresar la contraseña -->
                                <div class="mb-3">
                                    <label for="exampleInputEmail1" class="form-label"> Contraseña:  </label>

                                    <!-- Valida que la contraseña cumpla con los requisitos indicados -->
                                    <input type="password" name="contraseña" class="form-control" id="contraseña" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" accept="password/*" required>

                                    <!-- Espacio para mostrar mensajes relacionados con la contraseña -->
                                    <div id="contraseña" class="form-text"></div>

                                </div>


                                <!-- Requisitos que debe cumplir la contraseña -->
                                <p id="parrafo2">
                                    La contraseña debe tener: <br>
                                    8 caractéres <br>
                                    Una letra mayúscula <br>
                                    Una letra minúscula <br>
                                    Un número <br>
                                    Un carácter especial <br>
                                </p>


                                <!-- Lista para seleccionar el rol del usuario -->
                                <div class="mb-2">

                                    <label for="rol"> Rol de Usuario: </label>

                                    <select class="form-select" name="rolusuario" id="rolusuario">
                                        <option value="vendedor">Vendedor</option>
                                        <option value="cliente">Cliente</option>
                                        <option value="administrador">Administrador</option>
                                        <option value="superadministrador">Super administrador</option>

                                    </select>

                                </div>

                                <br />


                                <!-- Campo para escribir el nombre completo -->
                                <div class="mb-3">
                                    <label for="exampleInputEmail1" class="form-label"> Nombre completo:  </label>
                                    <input type="text" class="form-control" id="nombrecomp" pattern="^[a-zA-ZÀ-ÿ\u00f1\u00d1]+(\s*[a-zA-ZÀ-ÿ\u00f1\u00d1]*)*[a-zA-ZÀ-ÿ\u00f1\u00d1]+$" minlength="2" title="Sólo letras" accept="text/*" required>
                                </div>

                                <br />


                                <!-- Campo para seleccionar la fecha de nacimiento -->
                                <div class="mb-3">
                                    <label for="exampleInputEmail1" class="form-label"> Fecha de nacimiento:  </label>
                                    <input type="date" id="nacimiento" title="Antes del día actual" accept="date/*" required>

                                </div>

                                <br />


                                <!-- Lista para seleccionar el sexo -->
                                <div class="mb-2">


                                    <label for="categorias"> Sexo: </label>

                                    <select class="form-select" name="sexo" id="sexo">
                                        <option value="hombre">Hombre</option>
                                        <option value="mujer">Mujer</option>

                                    </select>

                                </div>

                                <br />


                                <!-- Campo para indicar la fecha de ingreso al portal -->
                                <div class="mb-3">
                                    <label for="exampleInputEmail1" class="form-label"> Fecha de ingreso al portal:  </label>
                                    <input type="date" id="nacimiento" title="Antes del día actual" accept="date/*" required>

                                </div>

                                <br />


                                <!-- Campo para seleccionar una imagen de avatar -->
                                <div class="mb-3">
                                    <label for="exampleInputEmail1" class="form-label"> Imagen de avatar:  </label>
                                    <input id="foto" name="imagen" class="form-control" type="file" accept="image/*" required>
                                </div>

                                <br />


                                <!-- Carga nuevamente el archivo JavaScript -->
                                <script src="registro_usuario.js"></script>

                                <!-- Botón para enviar el formulario -->
                                <button type="submit" class="btn btn-primary"> Registro completo </button>

                            </form>

                            <br />





                        </nav>


                    </div>

                </div>

            </div>

        </div>



    </center>

</body>

</html>
