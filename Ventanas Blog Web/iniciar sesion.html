<!DOCTYPE html>

<!-- Indica que el documento utiliza HTML5 -->
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>

    <!-- Configura la codificación de caracteres para admitir acentos y caracteres especiales -->
    <meta charset="utf-8" />

    <!-- Título que aparece en la pestaña del navegador -->
    <title> INICIAR SESION </title>

    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="iniciar sesion.css" />

    <!-- Biblioteca Bootstrap para utilizar estilos y componentes prediseñados -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
          crossorigin="anonymous">

</head>

<body>

    <!-- Centra todo el contenido de la página -->
    <center>

        <br><br>

        <!-- Contenedor principal del formulario -->
        <div class="cuadro">

            <div class="borde">

                <!-- Contenedor central del contenido -->
                <div id="centro">

                    <!-- Contenedor del logotipo y formulario -->
                    <div class="logo">

                        <!-- Imagen del logotipo -->
                        <img src="av8ao2zs5pq51.jpg" alt="logo" />

                        <br><br><br>

                        <!-- Título principal -->
                        <p id="parrafo"> INICIAR SESION </p>

                        <!-- Sección del formulario -->
                        <nav>

                            <!-- Campo para ingresar el nombre de usuario -->
                            <div class="mb-3">

                                <label for="usuario" class="form-label">
                                    Usuario:
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="usuario"
                                       required />

                            </div>

                            <!-- Campo para ingresar la contraseña -->
                            <div class="mb-3">

                                <label for="contraseña" class="form-label">
                                    Contraseña:
                                </label>

                                <input type="password"
                                       class="form-control"
                                       id="contraseña"
                                       required>

                            </div>

                            <br>

                            <!-- Formulario que envía la información al iniciar sesión -->
                            <form action="" target="">

                                <!-- Botón para iniciar sesión -->
                                <button type="submit" class="btn btn-primary">
                                    Ingresar
                                </button>

                            </form>

                            <br>

                            <!-- Enlace para ir a la página de registro -->
                            <p>
                                <a class="link-dark" href="registro usuario.html">
                                    Registrarse
                                </a>
                            </p>

                        </nav>

                    </div>

                </div>

            </div>

        </div>

        <br><br><br><br>

        <!-- Pie de página -->
        <footer>

            <div class="footer-bottom">

                <br>

                <!-- Título del apartado de autores -->
                <p1>AUTORES DE LA PAGINA:</p1>

                <!-- Nombres de los desarrolladores -->
                <p>Miguel Angel Fernández del Bosque</p>

                <p>Francisco Daniel Mata Mendoza</p>

                <br>

            </div>

        </footer>

    </center>

</body>

</html>
